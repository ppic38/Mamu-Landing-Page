<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAMU Store — Your Daily Basic Wear</title>
<meta name="description" content="Masuk ke store MAMU: dinding warna, rak kayu pinus, meja lipatan, manekin, dan kasir dalam 3D. Basic wear harian dari Makassar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#F4F1EA; --bone-2:#E9E4D8; --ink:#141210; --ink-60:rgba(20,18,16,.62);
  --ink-30:rgba(20,18,16,.18); --clay:#9B4B2F; --pine:#D9B384;
  --ff-d:"Instrument Serif",Georgia,serif;
  --ff-b:"Archivo",system-ui,sans-serif;
  --ff-m:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#EFECE6;color:var(--ink);font-family:var(--ff-b);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
::selection{background:var(--clay);color:#fff}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--ff-d);font-weight:400;line-height:1.03;letter-spacing:-.015em}

/* ---------- layers ---------- */
#gl{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%}
#grain{position:fixed;inset:-1px;z-index:6;pointer-events:none;opacity:.04;mix-blend-mode:multiply;background-repeat:repeat;background-size:170px 170px}
#vig{position:fixed;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(130% 100% at 50% 45%,transparent 55%,rgba(60,50,40,.20) 100%)}
.scroller{position:relative;z-index:10}
.room{height:100svh;display:flex;align-items:center;pointer-events:none}
.room .wrap{width:100%;max-width:1220px;margin:0 auto;padding:0 clamp(20px,4vw,56px)}

/* ---------- preloader ---------- */
#pre{position:fixed;inset:0;z-index:100;background:#0B0907;color:var(--bone);display:grid;place-items:center;transition:opacity .8s var(--ease),visibility .8s}
#pre.done{opacity:0;visibility:hidden;pointer-events:none}
.pre-in{width:min(300px,74vw);text-align:center}
.pre-logo{height:30px;margin:0 auto 26px;display:block}
.pre-bar{position:relative;height:1px;background:rgba(244,241,234,.16);overflow:hidden}
.pre-bar i{position:absolute;inset:0 100% 0 0;background:var(--bone);transition:right .3s linear}
.pre-meta{display:flex;justify-content:space-between;margin-top:12px;font-family:var(--ff-m);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,241,234,.45)}
.pre-meta b{color:rgba(244,241,234,.85);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- pintu ---------- */
#door{position:fixed;inset:0;z-index:90;background:#0B0907;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;transition:opacity 1.1s var(--ease),transform 1.3s var(--ease),visibility 1.3s}
#door.open{opacity:0;visibility:hidden;transform:scale(1.35)}
#door iframe{width:min(72vw,760px);height:min(54vh,500px);border:0;display:block;pointer-events:none}
#door .cap{text-align:center;color:rgba(244,241,234,.75);padding:0 20px}
#door .cap h1{font-size:clamp(26px,3.4vw,42px);color:var(--bone);margin-bottom:8px}
#door .cap p{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,241,234,.5)}
.enter{margin-top:6px;display:inline-flex;align-items:center;gap:12px;padding:15px 30px;border:1px solid rgba(244,241,234,.35);
  border-radius:999px;color:var(--bone);font-family:var(--ff-m);font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:.4s var(--ease)}
.enter:hover{background:var(--bone);color:#0B0907;border-color:var(--bone)}

/* ---------- hud (terang: store bergaya Uniqlo) ---------- */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .9s var(--ease) .3s}
#hud.on{opacity:1}
.hud-top{position:absolute;top:0;left:0;right:0;height:62px;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(16px,3vw,32px);background:linear-gradient(rgba(239,236,230,.92),rgba(239,236,230,0))}
.hud-logo{pointer-events:auto;display:block;height:20px}
.hud-links{display:flex;gap:16px;pointer-events:auto}
.hud-links a{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);transition:color .3s;position:relative;padding:3px 0}
.hud-links a:hover,.hud-links a.on{color:var(--ink)}
.hud-links a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--clay)}
.hud-bot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;padding:0 clamp(16px,3vw,32px) clamp(16px,2.6vh,26px)}
.hud-bot .mono{font-family:var(--ff-m);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-60)}
.cue{display:flex;align-items:center;gap:10px;color:var(--ink-60);font-family:var(--ff-m);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase}
.cue .track{width:52px;height:1px;background:var(--ink-30);position:relative;overflow:hidden}
.cue .track i{position:absolute;inset:0;background:var(--ink);transform-origin:left;animation:cue 2.8s var(--ease) infinite}
@keyframes cue{0%{transform:scaleX(0)}42%{transform:scaleX(1)}100%{transform:scaleX(1) translateX(100%)}}

/* ---------- panel ---------- */
.panel{max-width:430px;pointer-events:auto;background:rgba(250,248,244,.94);backdrop-filter:blur(16px);
  border:1px solid rgba(20,18,16,.08);border-radius:18px;padding:clamp(22px,2.4vw,30px);
  box-shadow:0 30px 80px -40px rgba(40,30,20,.45);
  opacity:0;transform:translate3d(0,30px,0);transition:opacity .8s var(--ease),transform .9s var(--ease)}
.room.in .panel{opacity:1;transform:none}
.room.right .wrap{display:flex;justify-content:flex-end}
.panel .k{font-family:var(--ff-m);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-60)}
.panel .k b{color:var(--clay);font-weight:500}
.panel h2{font-size:clamp(26px,2.9vw,38px);margin:10px 0 10px}
.panel p{font-size:14.5px;color:var(--ink-60)}
.panel .btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;
  font-size:13px;font-weight:600;border:1px solid var(--ink);transition:.25s;cursor:pointer}
.btn-fill{background:var(--ink);color:var(--bone)}
.btn-fill:hover{background:var(--clay);border-color:var(--clay)}
.btn-line:hover{background:var(--ink);color:var(--bone)}
.stats{display:flex;gap:26px;margin-top:18px;padding-top:15px;border-top:1px solid var(--ink-30)}
.stats b{display:block;font-family:var(--ff-d);font-size:28px;line-height:1}
.stats span{font-family:var(--ff-m);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60)}
.list{display:grid;gap:1px;margin-top:15px;background:var(--ink-30);border:1px solid var(--ink-30);border-radius:12px;overflow:hidden}
.list a{background:rgba(250,248,244,.97);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;transition:background .25s}
.list a:hover{background:#fff}
.list small{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-60);white-space:nowrap}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}
.sw i{width:22px;height:22px;border-radius:50%;border:1px solid var(--ink-30);display:block}
.poses-t{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin-top:16px}
.poses{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.poses button{padding:7px 12px;border:1px solid var(--ink-30);border-radius:999px;font-family:var(--ff-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-60);transition:.2s}
.poses button:hover{color:var(--ink);border-color:var(--ink)}
.poses button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}
.thumbs a{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bone-2)}
.thumbs img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.thumbs a:hover img{transform:scale(1.08)}
.product-peek{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.product-peek a{position:relative;display:block;height:106px;border-radius:9px;overflow:hidden;background:var(--bone-2)}
.product-peek img{width:100%;height:100%;object-fit:cover;object-position:center 42%;transition:transform .4s var(--ease)}
.product-peek a:hover img{transform:scale(1.07)}
.product-peek span{position:absolute;left:0;right:0;bottom:0;padding:19px 7px 6px;background:linear-gradient(transparent,rgba(0,0,0,.68));color:#fff;font-size:10px;font-weight:600;line-height:1.2}

/* ---------- tag hover + sheet produk ---------- */
#tag{position:fixed;z-index:30;pointer-events:none;opacity:0;transform:translate3d(0,8px,0);transition:opacity .2s,transform .2s;
  background:rgba(20,18,16,.92);color:var(--bone);border-radius:12px;padding:10px 14px;
  font-family:var(--ff-m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#tag.on{opacity:1;transform:none}
#tag b{display:block;font-family:var(--ff-b);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;margin-bottom:3px}
#sheet{position:fixed;inset:auto 0 0 0;z-index:40;pointer-events:none}
.sheet-in{position:relative;max-width:720px;max-height:min(82svh,650px);overflow:auto;margin:0 auto clamp(14px,3vh,28px);pointer-events:auto;
  background:rgba(250,248,244,.97);backdrop-filter:blur(18px);border:1px solid rgba(20,18,16,.08);
  border-radius:22px;padding:22px;box-shadow:0 40px 90px -40px rgba(40,30,20,.55);
  transform:translate3d(0,140%,0);transition:transform .7s var(--ease)}
#sheet.on .sheet-in{transform:none}
.sheet-product{display:grid;grid-template-columns:minmax(190px,238px) minmax(0,1fr);gap:22px;align-items:start}
.sheet-in .ph{margin:0;min-height:310px;border-radius:13px;overflow:hidden;background:var(--bone-2);position:relative}
.sheet-in .ph img{width:100%;height:310px;object-fit:cover}
.sheet-in .ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(20,18,16,.68));color:#fff;font-size:10px;letter-spacing:.04em}
.sheet-summary{min-width:0}
.product-options{min-width:0}
.sheet-in h3{font-family:var(--ff-b);font-size:18px;font-weight:700;letter-spacing:0;padding-right:24px}
.sheet-in .pr{font-size:17px;font-weight:700;margin:2px 0 6px}
.sheet-in p{font-size:13.5px;color:var(--ink-60)}
.sheet-note{display:block;margin-top:8px;font-size:11px;line-height:1.4;color:var(--ink-60)}
.opt-t{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin:12px 0 7px}
.opt-t b{color:var(--ink);font-weight:600}
.cols{display:flex;gap:7px;flex-wrap:wrap}
.cols button{width:26px;height:26px;border-radius:50%;border:1px solid var(--ink-30);transition:.2s}
.cols button.on{box-shadow:0 0 0 2px #FAF8F4,0 0 0 3.5px var(--ink)}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sizes button{min-width:40px;height:34px;padding:0 9px;border:1px solid var(--ink-30);border-radius:9px;font-size:12.5px;font-weight:600;transition:.2s}
.sizes button.on,.sizes button:hover{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.sheet-x{position:absolute;z-index:2;top:14px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(250,248,244,.96);font-size:22px;line-height:1;color:var(--ink-60);box-shadow:0 2px 10px rgba(0,0,0,.12)}
body:has(#sheet.on) .fab{opacity:0;pointer-events:none}

/* ---------- rail + fab ---------- */
.rail{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:22;display:flex;flex-direction:column;gap:11px;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .8s var(--ease)}
.rail.on{opacity:1;pointer-events:auto}
.rail button{width:26px;height:10px;display:grid;place-items:center;justify-items:end}
.rail i{display:block;width:12px;height:1px;background:rgba(20,18,16,.3);transition:.5s var(--ease)}
.rail button.on i{width:26px;background:var(--clay)}
.rail button:hover i{width:26px;background:var(--ink)}
.fab{position:fixed;right:18px;bottom:18px;z-index:45;width:52px;height:52px;border-radius:50%;background:#25D366;
  display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:.25s;opacity:0;pointer-events:none}
.fab.on{opacity:1;pointer-events:auto}
.fab:hover{transform:scale(1.08)}
.fab svg{width:26px;height:26px;fill:#fff}

@media(max-width:900px){
  .hud-links{display:none}
  .rail{display:none}
  .panel{max-width:none}
  .room{align-items:flex-end;padding-bottom:70px}
  .room.right .wrap{justify-content:flex-start}
  #door iframe{width:92vw;height:38vh}
  #room-manekin .list,#room-manekin .panel p{display:none}
  .poses{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .poses::-webkit-scrollbar{display:none}
  .poses button{flex:0 0 auto}
  .product-peek a{height:74px}
}
@media(max-width:600px){
  .sheet-in{margin:0 8px 8px;padding:16px;max-height:85svh;border-radius:18px}
  .sheet-product{grid-template-columns:1fr;gap:12px}
  .sheet-in .ph{min-height:190px}
  .sheet-in .ph img{height:190px;object-position:center 42%}
  .sheet-in .ph figcaption{font-size:8px;padding:12px 6px 5px}
  .sheet-in h3{font-size:16px}
}
button:focus-visible,a:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

/* logo MAMU: huruf geometris tipis dengan A tanpa palang (Λ), seperti di feed */
function drawLogo(x,cx,cy,h,col,lw){
  const wM=h*.94, wA=h*.84, wU=h*.74, gap=h*.34;
  const total=wM*2+wA+wU+gap*3; let px=cx-total/2;
  const top=cy-h/2, bot=cy+h/2;
  x.save(); x.strokeStyle=col; x.lineWidth=lw; x.lineJoin='miter'; x.lineCap='butt'; x.miterLimit=10;
  const M=()=>{x.beginPath();x.moveTo(px+lw/2,bot);x.lineTo(px+lw/2,top+lw/2);x.lineTo(px+wM/2,bot-h*.30);
    x.lineTo(px+wM-lw/2,top+lw/2);x.lineTo(px+wM-lw/2,bot);x.stroke();px+=wM+gap;};
  const A=()=>{x.beginPath();x.moveTo(px,bot);x.lineTo(px+wA/2,top+lw/2);x.lineTo(px+wA,bot);x.stroke();px+=wA+gap;};
  const U=()=>{x.beginPath();x.moveTo(px+lw/2,top);x.lineTo(px+lw/2,bot-wU/2);
    x.arc(px+wU/2,bot-wU/2,wU/2-lw/2,Math.PI,0,true);x.lineTo(px+wU-lw/2,top);x.stroke();px+=wU;};
  M();A();M();U();
  x.restore();
}

       const v=i/(N-1),th=j/M*Math.PI*2;
       const wrinkle=(.7*Math.sin(th*5+v*8)+.4*Math.sin(th*8-v*12))*Math.sin(Math.PI*v);

    for(const ze of [z0,z1]){
      for(const xp of [xb,xf]) parts.push(new THREE.BoxGeometry(.046,2.5,.046).translate(xp,1.25,ze));
      for(const yy of [.12,1.62,2.46]) parts.push(new THREE.BoxGeometry(Math.abs(xf-xb),.036,.036).translate((xb+xf)/2,yy,ze));

const NMAP={};
function fabricNormal(kind){
  if(NMAP[kind])return NMAP[kind];
  const S=256,h=new Float32Array(S*S),R=seeded(kind.length*97+7);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){let v;
    if(kind==='knit'){const u=(x%16)/16,w=(y%12)/12,sk=.18*(w-.5);
      v=Math.max(Math.exp(-(((u-.27-sk)/.13)**2)),Math.exp(-(((u-.73+sk)/.13)**2)))*(.6+.4*Math.sin(Math.PI*w));}
    else if(kind==='pique')v=Math.pow(Math.abs(Math.cos(Math.PI*x/8)*Math.cos(Math.PI*y/8)),.6);
    else if(kind==='twill')v=.5+.5*Math.sin(2*Math.PI*(x+y)/8)+.15*Math.sin(2*Math.PI*x/4);
    else{const cx=x>>3,cy=y>>3;v=(cx+cy)%2?Math.sin(Math.PI*(x%8)/8):Math.sin(Math.PI*(y%8)/8);}
    h[y*S+x]=v+(R()-.5)*.22;}
  const c=cnv(S,S),cx=c.getContext('2d'),im=cx.createImageData(S,S),d=im.data,st=2.2,at=(a,b)=>h[((b+S)%S)*S+((a+S)%S)];
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){const gx=(at(x+1,y)-at(x-1,y))*st,gy=(at(x,y+1)-at(x,y-1))*st,il=1/Math.hypot(gx,gy,1),i=(y*S+x)*4;
    d[i]=(-gx*il*.5+.5)*255;d[i+1]=(gy*il*.5+.5)*255;d[i+2]=(il*.5+.5)*255;d[i+3]=255;}
  cx.putImageData(im,0,0);
  const t=tex(c,{srgb:false});t.wrapS=t.wrapT=THREE.RepeatWrapping;t.channel=1;
  const tile={knit:.022,pique:.028,twill:.03,oxford:.026}[kind];t.repeat.set(1/tile,1/tile);
  return NMAP[kind]=t;
}

class Cloth{
  constructor(w,h,sx,sy,mat){
    this.sx=sx;this.sy=sy;this.nx=sx+1;this.ny=sy+1;
    this.geo=new THREE.PlaneGeometry(w,h,sx,sy);this.base=Float32Array.from(this.geo.attributes.position.array);
    const N=this.nx*this.ny;this.cur=new Float32Array(N);this.prev=new Float32Array(N);this.next=new Float32Array(N);
    this.hang=new Float32Array(this.ny);for(let j=0;j<this.ny;j++)this.hang[j]=Math.pow(j/sy,1.3);
    this.mesh=new THREE.Mesh(this.geo,mat);this.t=Math.random()*40;this.gust=.5;this.amp=.085;this.drape=.05;this.wind=.7;
  }
  step(dt){
    this.t+=dt;const tg=Math.max(.55+.35*Math.sin(this.t*.31+1.3)+.25*Math.sin(this.t*.83),.15);
    this.gust+=(tg-this.gust)*Math.min(dt*2,1);
    const nx=this.nx,ny=this.ny,cur=this.cur,prev=this.prev,next=this.next;
    const c2=900,dt2=Math.min(dt,1/50)**2,decay=Math.exp(-dt),wind=5*this.wind*this.gust;
    const kb=(Math.PI*2)/(this.sx/1.6),kb2=(Math.PI*2)/(this.sx/3.6),drift=1.8*Math.sin(.23*this.t);
    for(let j=0;j<ny;j++){const up=Math.max(j-1,0)*nx,dn=Math.min(j+1,this.sy)*nx,row=j*nx;
      const col=(.7+.3*Math.sin((Math.PI*2)/(this.sy/2.2)*j-1.7*this.t))*this.hang[j];
      for(let i=0;i<nx;i++){const k=row+i,h=cur[k];
        const lap=cur[row+Math.max(i-1,0)]+cur[row+Math.min(i+1,this.sx)]+cur[up+i]+cur[dn+i]-4*h;
        const f=wind*(Math.sin(kb*i-30*kb*this.t+drift)+.45*Math.sin(kb2*i+30*kb2*this.t*.8+3))*col;
        const nv=2*h-prev[k]+dt2*(c2*lap-.55*h+f);let v=h+(nv-h)*decay;
        next[k]=v>3.5?3.5:(v<-3.5?-3.5:v);}}
    for(let i=0;i<nx;i++)next[i]=0;
    const sp=this.prev;this.prev=this.cur;this.cur=next;this.next=sp;
  }
  compose(){const pos=this.geo.attributes.position;
    for(let j=0;j<this.ny;j++){const row=j*this.nx;
      for(let i=0;i<this.nx;i++){const k=row+i,z=this.amp*Math.tanh(this.cur[k])+this.drape*this.hang[j]*(.3+.7*this.gust);
        pos.setXYZ(k,this.base[k*3],this.base[k*3+1],z);}}
    pos.needsUpdate=true;this.geo.computeVertexNormals();}
  update(dt){if(REDUCE)return;this.step(dt);this.compose();}
}

    const cg=new THREE.PlaneGeometry(1.3,2.1,24,1),cp=cg.attributes.position;
    for(let i=0;i<cp.count;i++)cp.setZ(i,Math.sin(cp.getX(i)*24+b)*.035);
    cg.computeVertexNormals();
    const cur=new THREE.Mesh(cg,curtMat);cur.position.set(xc,1.26,Z1+1.46);scene.add(cur);
  }
  const fm=new THREE.Mesh(mergeGeometries(parts),pineMat);fm.castShadow=true;scene.add(fm);

  /* kasir */
  const kx=5.8,kz=-30.2;
  const body=new THREE.Mesh(new THREE.BoxGeometry(4.4,.98,.72),whiteMat);body.position.set(kx,.49,kz);body.castShadow=true;body.receiveShadow=true;scene.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(4.5,.05,.8),pineMat);top.position.set(kx,1.0,kz);scene.add(top);
  const front=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.4),new THREE.MeshBasicMaterial({map:tex(logoCanvas(800,200,'#141210','#F6F4F0'))}));
  front.position.set(kx,.6,kz+.362);scene.add(front);
  for(const dx of [-1.4,0,1.4]){
    const reg=new THREE.Mesh(new THREE.BoxGeometry(.3,.26,.04),inkMat);reg.position.set(kx+dx,1.2,kz-.1);reg.rotation.x=-.25;scene.add(reg);
    const scr=new THREE.Mesh(new THREE.PlaneGeometry(.26,.2),new THREE.MeshBasicMaterial({color:new THREE.Color(1.25,1.2,1.1)}));
    scr.position.set(kx+dx,1.2,kz-.078);scr.rotation.x=-.25;scene.add(scr);
  }
  /* dinding tote di belakang kasir */
  const shelf=[];for(let r=0;r<3;r++)shelf.push(new THREE.BoxGeometry(4.6,.03,.3).translate(kx,1.1+r*.6,Z1+.15));
  scene.add(new THREE.Mesh(mergeGeometries(shelf),pineMat));
  const toteGeo=new THREE.BoxGeometry(.3,.36,.02);
  for(let r=0;r<3;r++)for(let k=0;k<9;k++){
    const t=new THREE.Mesh(toteGeo,new THREE.MeshStandardMaterial({color:(k+r)%2?'#191714':'#F2EFE8',roughness:.9}));
    t.position.set(kx-2.0+k*.5,1.1+r*.6+.2,Z1+.12);t.rotation.x=-.08;scene.add(t);
  }
  /* dinding belakang: logo besar + papan tujuh kota */
  const logo=new THREE.Mesh(new THREE.PlaneGeometry(4.4,1.1),new THREE.MeshBasicMaterial({map:tex(logoCanvas(1600,400,'#141210',null,'YOUR DAILY BASIC WEAR.')),transparent:true}));
  logo.position.set(-.8,3.72,Z1+.02);scene.add(logo);
  const cities=new THREE.Mesh(new THREE.PlaneGeometry(2.0,2.4),new THREE.MeshBasicMaterial({map:tex(citiesCanvas())}));
  cities.position.set(-.8,1.65,Z1+.02);scene.add(cities);
  const cf=new THREE.Mesh(new THREE.BoxGeometry(2.1,2.5,.04),pineMat);cf.position.set(-.8,1.65,Z1+.0);scene.add(cf);
}
job('Membuka kasir');

/* ================= bangun instance ================= */
const hlColor=new THREE.Color();
function build(kind,geo,mat,items){
  if(!items.length) return null;
  const im=new THREE.InstancedMesh(geo,mat,items.length);
  items.forEach((it,i)=>{im.setMatrixAt(i,it.m);if(it.c)im.setColorAt(i,new THREE.Color(it.c));});
  im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true;
  im.computeBoundingSphere();im.castShadow=true;im.receiveShadow=true;
  if(items[0].p!==undefined){im.userData.pick=i=>items[i];PICK.push(im);}
  im.userData.items=items;
  scene.add(im);return im;
}
build('tee',G.tee,clothMat,POOL.tee);
build('long',G.long,clothMat,POOL.long);
build('pants',G.pants,clothMat,POOL.pants);
build('fold',new RoundedBoxGeometry(.34,.05,.28,2,.018),foldMat,POOL.fold);
build('hanger',mergeGeometries([new THREE.BoxGeometry(.42,.014,.016),
  new THREE.TorusGeometry(.03,.004,6,12,Math.PI*1.3).rotateZ(-.2).translate(0,.06,0),
  new THREE.CylinderGeometry(.004,.004,.04,5).translate(0,.025,0)]),pineMat,POOL.hanger);
/* Detail khusus pada baju yang menghadap lorong. Bentuk dasar tetap 3D,
   detail dijahit di atasnya agar setiap model terbaca dari dekat. */
function dressFeatured(o){
  const pr=PRODUCTS[o.p],base=new THREE.Color(pr.cols[o.ci][1]);
  const g=new THREE.Group();g.position.set(o.x,o.y-.33,o.z);g.rotation.y=o.ry;g.scale.set(ST,ST,ST*o.f);
  const fabric=new THREE.MeshPhysicalMaterial({color:base,roughness:.94,side:THREE.DoubleSide,sheen:.38});
  const raised=new THREE.MeshPhysicalMaterial({color:base.clone().multiplyScalar(.9),roughness:.9,side:THREE.DoubleSide});
  const seamMat=new THREE.MeshStandardMaterial({color:base.clone().lerp(new THREE.Color('#F4F1EA'),.23),roughness:1});
  const darkMat=new THREE.MeshStandardMaterial({color:base.clone().multiplyScalar(.55),roughness:.9});
  const patch=(points,z,mat)=>{const s=new THREE.Shape();points.forEach(([x,y],i)=>i?s.lineTo(x,y):s.moveTo(x,y));s.closePath();
    const m=new THREE.Mesh(new THREE.ShapeGeometry(s),mat);m.position.z=z;m.castShadow=true;g.add(m);return m;};
  const seam=points=>{const c=new THREE.CatmullRomCurve3(points.map(v=>new THREE.Vector3(...v)));
    const m=new THREE.Mesh(new THREE.TubeGeometry(c,Math.max(4,points.length*3),.28,4,false),seamMat);g.add(m);};
  const button=(x,y,z)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.95,8,6),darkMat);m.scale.z=.38;m.position.set(x,y,z);g.add(m);};
  const collar=()=>{
    patch([[-17,47],[-2,44],[-7,31],[-21,43]],14.6,raised);
    patch([[17,47],[2,44],[7,31],[21,43]],14.6,raised);
    seam([[-20,43,15],[-8,31,15.4],[-2,44,15]]);
    seam([[20,43,15],[8,31,15.4],[2,44,15]]);
  };
  if(pr.id==='polo'){
    collar();
    const pl=new THREE.Mesh(new THREE.BoxGeometry(5,25,.9),fabric);pl.position.set(0,28,15.8);pl.castShadow=true;g.add(pl);
    seam([[-2.8,40,16.4],[-2.8,16,16.4]]);
    [36,28,20].forEach(y=>button(0,y,16.7));
  }else if(pr.id==='over'){
    collar();
    const pl=new THREE.Mesh(new THREE.BoxGeometry(5,104,.8),raised);pl.position.set(0,-11,15.8);pl.castShadow=true;g.add(pl);
    [-49,-34,-19,-4,11,26,39].forEach(y=>button(0,y,16.4));
    for(const sg of [-1,1]){
      const pocket=new THREE.Mesh(new RoundedBoxGeometry(17,20,1.3,2,.7),fabric);
      pocket.position.set(sg*18,12,15.7);pocket.castShadow=true;g.add(pocket);
      patch([[sg*9,23],[sg*27,23],[sg*25,18],[sg*11,18]],16.7,raised);
      seam([[sg*10,22,17],[sg*18,18,17],[sg*26,22,17]]);
    }
  }else if(pr.id==='graph'||pr.id==='mbtb'){
    const art=pr.id==='graph'?graphicBack('#E8DDC4'):mbtbFront('#F1EDE4');
    const map=tex(art),mesh=new THREE.Mesh(new THREE.PlaneGeometry(pr.id==='graph'?47:25,pr.id==='graph'?55:16),
      new THREE.MeshBasicMaterial({map,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
    mesh.position.set(0,pr.id==='graph'?-3:22,pr.id==='graph'?-17.5:17.5);
    if(pr.id==='graph')mesh.rotation.y=Math.PI;
    g.add(mesh);
  }
  /* jahitan hem dan lipatan kecil menambah arah cahaya pada bidang depan */
  seam([[-31,-65,13.4],[-15,-65.4,13.6],[0,-65.1,13.2],[15,-65.5,13.6],[31,-65,13.4]]);
  scene.add(g);
}
FEATURED.forEach(dressFeatured);
renderer.shadowMap.needsUpdate=true;
job('Siap dibuka');

/* ================= kamera ================= */
const CAMS=ROOMS.map(r=>MOBILE&&r.mcam?r.mcam:r.cam);   /* layar sempit: panel di bawah, subjek di tengah atas */
const curveP=new THREE.CatmullRomCurve3(CAMS.map(c=>new THREE.Vector3(...c.p)),false,'catmullrom',.4);
const curveT=new THREE.CatmullRomCurve3(CAMS.map(c=>new THREE.Vector3(...c.t)),false,'catmullrom',.4);
const _p=new THREE.Vector3(),_t=new THREE.Vector3();
let smooth=0,mx=0,my=0,tmx=0,tmy=0;

/* ================= DOM ================= */
const scroller=$('#scroller');
scroller.innerHTML=ROOMS.map(r=>`<section class="room ${r.side==='right'?'right':''}" id="room-${r.id}" data-room>
  <div class="wrap"><div class="panel">${r.html}</div></div></section>`).join('');
const roomEls=$$('[data-room]');
$('#hudlinks').innerHTML=ROOMS.map((r,i)=>`<a href="#room-${r.id}" data-i="${i}">${r.name}</a>`).join('');
$('#rail').innerHTML=ROOMS.map((r,i)=>`<button title="${r.name}" data-i="${i}"><i></i></button>`).join('');
const railBtns=$$('#rail button'),hudLinks=$$('#hudlinks a');
const goTo=i=>roomEls[i].scrollIntoView({behavior:REDUCE?'auto':'smooth'});
railBtns.forEach(b=>b.onclick=()=>goTo(+b.dataset.i));
hudLinks.forEach(a=>a.onclick=e=>{e.preventDefault();goTo(+a.dataset.i);});
$('#home').onclick=e=>{e.preventDefault();goTo(0);};
initPoseUI();

let anchors=[],active=-1;
function measure(){
  const max=Math.max(1,document.documentElement.scrollHeight-vpH());
  anchors=roomEls.map((el,i)=>i===0?0:(i===roomEls.length-1?max:clamp(el.offsetTop+el.offsetHeight*.5-vpH()*.5,0,max)));
  for(let i=1;i<anchors.length;i++)anchors[i]=Math.max(anchors[i],anchors[i-1]+1);
}
function progressFor(y){
  if(y<=anchors[0])return 0;
  for(let i=0;i<anchors.length-1;i++)if(y<=anchors[i+1])return i+(y-anchors[i])/(anchors[i+1]-anchors[i]);
  return anchors.length-1;
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');}),{rootMargin:'0px 0px -22% 0px',threshold:.25});
roomEls.forEach(el=>io.observe(el));

/* ================= produk: hover, klik, sheet ================= */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(-9,-9);
const tag=$('#tag'),sheet=$('#sheet'),sheetIn=$('#sheetIn');
let sheetReturnFocus=null;
let hover=null,hoverKey='',hlMesh=null,hlIndex=-1,hlOrig=new THREE.Color(),openP=null,moved=false,rayTick=0;

function openSheet(p,ci){
  if(!sheetIn.contains(document.activeElement))sheetReturnFocus=document.activeElement;
  const pr=PRODUCTS[p];let size=pr.s[Math.min(1,pr.s.length-1)];ci=clamp(ci||0,0,pr.cols.length-1);openP=p;
  const render=()=>{
    const col=pr.cols[ci][0];
    sheetIn.innerHTML=`<button class="sheet-x" id="sx" aria-label="Tutup">×</button>
      <div class="sheet-product">
        <figure class="ph"><img src="${pr.img}" alt="Foto koleksi ${pr.n} dari MAMU"><figcaption>Foto koleksi @mamu_basic</figcaption></figure>
        <div class="sheet-summary"><h3>${pr.n}</h3><div class="pr">${pr.p}</div><p>${pr.d}</p>
          <div class="product-options">
            <div class="opt-t">Warna <b>${col}</b></div>
            <div class="cols">${pr.cols.map((c,i)=>`<button data-c="${i}" aria-label="Warna ${c[0]}" title="${c[0]}" style="background:${c[1]}"${i===ci?' class="on"':''}></button>`).join('')}</div>
            <div class="opt-t">Ukuran</div>
            <div class="sizes">${pr.s.map(s=>`<button${s===size?' class="on"':''}>${s}</button>`).join('')}</div>
            <span class="sheet-note">Foto menampilkan referensi koleksi. Konfirmasi stok, varian, dan harga akhir saat memesan.</span>
            <div style="display:grid;gap:8px;margin-top:16px">
              <a class="btn btn-fill" target="_blank" rel="noopener" href="https://wa.me/${WA_MAIN}?text=${encodeURIComponent(
                `Halo MAMU, saya mau tanya ${pr.n} — warna ${col}, ukuran ${size}. Stok dan harga terbarunya berapa?`)}">Pesan via WhatsApp</a>
              <a class="btn btn-line" target="_blank" rel="noopener" href="${SHOPEE}">Beli di Shopee</a>
            </div>
          </div>
        </div>
      </div>`;
    $('#sx').onclick=closeSheet;
    sheetIn.querySelectorAll('.cols button').forEach(b=>b.onclick=()=>{ci=+b.dataset.c;render();});
    sheetIn.querySelectorAll('.sizes button').forEach(b=>b.onclick=()=>{size=b.textContent;render();});
  };
  render();sheetIn.inert=false;sheet.classList.add('on');$('#sx').focus({preventScroll:true});
}
function closeSheet(){sheet.classList.remove('on');sheetIn.inert=true;openP=null;
  if(sheetReturnFocus&&sheetReturnFocus.isConnected)sheetReturnFocus.focus({preventScroll:true});
  sheetReturnFocus=null;
}
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-pid]');
  if(a){e.preventDefault();openSheet(P[a.dataset.pid],+a.dataset.ci||0);return;}
  if(e.target.closest('a,button,.panel,.sheet-in'))return;
  /* raycast langsung saat klik: layar sentuh tidak punya hover */
  ptr.set((e.clientX/vpW())*2-1,-((e.clientY/vpH())*2-1));doRaycast();
  if(hover)openSheet(hover.p,hover.ci);
});
addEventListener('pointermove',e=>{
  tmx=(e.clientX/vpW())*2-1;tmy=-((e.clientY/vpH())*2-1);ptr.set(tmx,tmy);moved=true;
  tag.style.left=(e.clientX+16)+'px';tag.style.top=(e.clientY+16)+'px';
},{passive:true});

function setHighlight(mesh,idx){
  if(hlMesh&&hlIndex>=0){hlMesh.setColorAt(hlIndex,hlOrig);hlMesh.instanceColor.needsUpdate=true;}
  hlMesh=null;hlIndex=-1;
  if(mesh&&mesh.isInstancedMesh&&mesh.instanceColor&&idx>=0){
    mesh.getColorAt(idx,hlOrig);hlColor.copy(hlOrig).lerp(new THREE.Color(1,1,1),.28);
    mesh.setColorAt(idx,hlColor);mesh.instanceColor.needsUpdate=true;hlMesh=mesh;hlIndex=idx;}
}
function doRaycast(){
  ray.setFromCamera(ptr,camera);ray.far=9;
  const hits=ray.intersectObjects(PICK,false);
  let h=null,mesh=null,idx=-1;
  if(hits.length){const o=hits[0].object;mesh=o;idx=hits[0].instanceId===undefined?-1:hits[0].instanceId;
    h=o.userData.pick(idx);}
  const key=h?(h.p+'-'+h.ci+'-'+idx+'-'+(mesh&&mesh.id)):'';
  if(key!==hoverKey){
    hoverKey=key;hover=h;setHighlight(mesh,idx);
    if(h){const pr=PRODUCTS[h.p];tag.innerHTML=`<b>${pr.n}</b>${pr.cols[h.ci][0]} · ${pr.p} · klik`;tag.classList.add('on');document.body.style.cursor='pointer';}
    else{tag.classList.remove('on');document.body.style.cursor='';}
  }
}

/* ================= loop ================= */
let last=performance.now(),running=false;
function frame(now){
  if(!running)return;requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000||0,.05);last=now;
  const prog=progressFor(scrollY);
  smooth=REDUCE?prog:damp(smooth,prog,4.2,dt);
  mx=damp(mx,tmx,2.2,dt);my=damp(my,tmy,2.2,dt);
  const u=clamp(smooth/(CAMS.length-1),0,1);
  curveP.getPoint(u,_p);curveT.getPoint(u,_t);
  _p.x+=mx*.28;_p.y+=my*.12;_t.x-=mx*.08;_t.y-=my*.04;
  camera.position.copy(_p);camera.lookAt(_t);

  const a=Math.round(smooth);
  if(a!==active){active=a;
    railBtns.forEach((b,i)=>b.classList.toggle('on',i===a));hudLinks.forEach((l,i)=>l.classList.toggle('on',i===a));
    $('#roomName').textContent=String(a+1).padStart(2,'0')+' — '+ROOMS[a].name.toUpperCase();}

  /* banner hanya disimulasikan saat terlihat dari dekat */
  if(smooth>3.2&&smooth<6.8) for(const b of BANNERS) b.update(dt);

  if(!COARSE&&!openP&&(moved||(rayTick++%6===0))){moved=false;doRaycast();}
  else if(openP&&hover){hover=null;hoverKey='';setHighlight(null,-1);tag.classList.remove('on');document.body.style.cursor='';}

  tickPoses(dt);
  renderer.render(scene,camera);
}
function resize(){camera.aspect=vpW()/vpH();camera.updateProjectionMatrix();renderer.setSize(vpW(),vpH());measure();}
addEventListener('resize',resize,{passive:true});
addEventListener('orientationchange',()=>setTimeout(resize,250));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)running=false;
  else if(!running&&$('#door').classList.contains('open')){running=true;last=performance.now();requestAnimationFrame(frame);}
});

/* grain */
(function(){const S=170,c=cnv(S,S),x=c.getContext('2d'),im=x.createImageData(S,S),d=im.data;
  for(let i=0;i<S*S;i++){const v=110+Math.random()*90;d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;}
  x.putImageData(im,0,0);$('#grain').style.backgroundImage='url('+c.toDataURL('image/png')+')';})();

resize();
camera.position.set(...CAMS[0].p);camera.lookAt(new THREE.Vector3(...CAMS[0].t));
renderer.render(scene,camera);

/* hook pemeriksaan: lompat ke perhentian i, dan cek apakah fokusnya terbidik */
window.__store={camera,scene,renderer,CAMS,RIGS,PLAT,POSES,setPose,applyPose,poseOf,
  pose(name,mir){PLAT.forEach(r=>{r.cur=poseOf(name,mir);r.k=1;applyPose(r,r.cur);});renderer.shadowMap.needsUpdate=true;renderer.render(scene,camera);},
  view(p,t){camera.position.set(...p);camera.lookAt(...t);camera.updateMatrixWorld(true);renderer.render(scene,camera);},
  jump(i){const u=clamp(i/(CAMS.length-1),0,1);curveP.getPoint(u,_p);curveT.getPoint(u,_t);
    camera.position.copy(_p);camera.lookAt(_t);camera.updateMatrixWorld(true);renderer.render(scene,camera);return ROOMS[i].name;},
  probe(){return ROOMS.map((r,i)=>{this.jump(i);const v=new THREE.Vector3(...r.focus).project(camera);
    const d=camera.position.distanceTo(new THREE.Vector3(...r.focus));
    const hidden=r.side==='right'?v.x>.3:v.x<-.3;
    return `${i} ${r.id.padEnd(9)} ndc=(${v.x.toFixed(2)},${v.y.toFixed(2)}) d=${d.toFixed(1)}m panel=${r.side} ${Math.abs(v.x)>1||Math.abs(v.y)>1||v.z>1?'LUAR LAYAR':hidden?'TERTUTUP':'ok'}`;});},
  counts(){return {tee:POOL.tee.length,long:POOL.long.length,pants:POOL.pants.length,fold:POOL.fold.length,hanger:POOL.hanger.length,
    calls:renderer.info.render.calls,tris:renderer.info.render.triangles};}};

setTimeout(()=>$('#pre').classList.add('done'),380);
$('#enter').onclick=()=>{
  $('#door').classList.add('open');document.body.classList.remove('locked');
  $('#hud').classList.add('on');$('#rail').classList.add('on');$('#fab').classList.add('on');
  running=true;last=performance.now();requestAnimationFrame(frame);
  measure();roomEls[0].classList.add('in');
};
</script>
